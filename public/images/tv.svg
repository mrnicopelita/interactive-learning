<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Television">
  <defs>
    <linearGradient id="tvBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4150"/>
      <stop offset="1" stop-color="#2b2533"/>
    </linearGradient>
    <linearGradient id="tvScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ee4ff"/>
      <stop offset="1" stop-color="#3fb4ff"/>
    </linearGradient>
    <clipPath id="tvClip">
      <rect x="95" y="115" width="410" height="300" rx="18"/>
    </clipPath>
  </defs>

  <ellipse cx="300" cy="560" rx="220" ry="24" fill="#000000" opacity="0.15"/>

  <g transform="rotate(-4 300 300)">
    <rect x="270" y="405" width="60" height="30" rx="10" fill="#2b2533"/>
    <rect x="225" y="425" width="150" height="20" rx="10" fill="#4a4150"/>
    <rect x="245" y="432" width="110" height="10" rx="5" fill="#2b2533"/>

    <rect x="72" y="92" width="456" height="340" rx="34" fill="url(#tvBody)" stroke="#1f1a26" stroke-width="7"/>

    <rect x="95" y="115" width="410" height="300" rx="18" fill="url(#tvScreen)"/>

    <g clip-path="url(#tvClip)">
      <circle cx="230" cy="190" r="36" fill="#ffd93d"/>
      <ellipse cx="170" cy="250" rx="50" ry="16" fill="#ffffff"/>
      <path d="M300 320 m-110 0 a110 110 0 0 1 220 0" stroke="#ff6b9d" stroke-width="13" fill="none"/>
      <path d="M300 320 m-90 0 a90 90 0 0 1 180 0" stroke="#4dc9ff" stroke-width="13" fill="none"/>
      <ellipse cx="480" cy="300" rx="150" ry="120" fill="#2fd26b"/>
      <ellipse cx="80" cy="330" rx="170" ry="130" fill="#1fae57"/>
    </g>

    <rect x="95" y="125" width="200" height="24" rx="10" fill="#ffffff" opacity="0.06"/>

    <circle cx="520" cy="412" r="6" fill="#2fd26b"/>
    <rect x="78" y="97" width="14" height="48" rx="7" fill="#8ee4ff"/>
  </g>
